# =============================================================================
# Nginx Configuration — ConvoSec_AI AI (ConvoSec_AI)
# =============================================================================
#
# Architecture:
#   - Frontend : React + Vite (built static files served by Nginx)
#   - Backend  : Express.js Node API on port 5000
#
# Nginx acts as:
#   1. Static file server  → serves /frontend/dist
#   2. Reverse proxy       → /api/*, /health, /uploads -> localhost:5000
#   3. SSL termination     → HTTPS on port 443 (HTTP redirects to HTTPS)
#
# Usage:
#   1. Build the frontend:  cd frontend && npm run build
#   2. Start the backend:   cd backend && npm start
#   3. Place this file at:  /etc/nginx/sites-available/ConvoSec_AI
#   4. Enable the site:     sudo ln -s /etc/nginx/sites-available/ConvoSec_AI \
#                                      /etc/nginx/sites-enabled/ConvoSec_AI
#   5. Test & reload:       sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── Worker processes (auto-detects number of CPU cores) ─────────────────────
worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── MIME types & basic settings ────────────────────────────────────────
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;   # Hide Nginx version in error pages

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/ConvoSec_AI_access.log main;
    error_log  /var/log/nginx/ConvoSec_AI_error.log  warn;

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Rate limiting zones ────────────────────────────────────────────────
    # General API zone  : 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    # Auth endpoints zone: 10 req/min per IP (stricter for login/register)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Upstream: Node.js Express backend ─────────────────────────────────
    upstream ConvoSec_AI_backend {
        server 127.0.0.1:5000;
        keepalive 32;   # Keep connections alive to the backend
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name your-domain.com www.your-domain.com;

        # Allow Let's Encrypt ACME challenge to pass through
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ──────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name your-domain.com www.your-domain.com;

        # ── SSL certificate paths (update after running certbot) ───────────
        ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

        # ── SSL hardening ──────────────────────────────────────────────────
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;
        resolver                  8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout          5s;

        # ── Security headers ───────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

        # ── Client body size (allow file/image uploads up to 15 MB) ───────
        client_max_body_size 15M;

        # ── Root: serve compiled Vite/React frontend ───────────────────────
        root /path/to/ConvoSec_AI/frontend/dist;
        index index.html;

        # ── Auth API routes (strict rate limiting) ─────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://ConvoSec_AI_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── General API routes ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://ConvoSec_AI_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }

        # ── Health check endpoint ──────────────────────────────────────────
        location /health {
            proxy_pass         http://ConvoSec_AI_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Allow internal monitoring IPs without rate limits
            access_log off;
        }

        # ── Uploaded files (served by backend's static middleware) ─────────
        location /uploads/ {
            proxy_pass         http://ConvoSec_AI_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Cache uploaded assets in browser for 7 days
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # ── Static assets (JS, CSS, fonts, images from Vite build) ────────
        location ~* \.(js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # ── SPA fallback: serve index.html for all unmatched routes ────────
        # This enables React Router (client-side routing) to work correctly.
        location / {
            try_files $uri $uri/ /index.html;

            # Disable caching for index.html so the app always gets the latest
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }
    }
}
